name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake gcc libclang-dev pkg-config python3
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Determine release
        id: metadata
        env:
          # The workspace has no root package, so select the release package explicitly.
          PACKAGE: "runtime"
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"

          if [ -n "$PACKAGE" ]; then
            package="$(jq -c --arg name "$PACKAGE" 'first(.packages[] | select(.name == $name)) // empty' <<<"$metadata")"
          else
            package="$(jq -c --arg manifest "$GITHUB_WORKSPACE/Cargo.toml" '
              if (.packages | length) == 1 then .packages[0]
              else first(.packages[] | select(.manifest_path == $manifest)) // empty
              end
            ' <<<"$metadata")"
          fi

          if [ -z "$package" ]; then
            echo "::error::Could not determine the package to release. Set PACKAGE to one of:"
            jq -r '.packages[].name' <<<"$metadata"
            exit 1
          fi

          name="$(jq -r '.name' <<<"$package")"
          version="$(jq -r '.version' <<<"$package")"
          tag="v${version}"

          should_release=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to publish."
          elif ! grep -qF "## [$version]" CHANGELOG.md && ! grep -qF "## [v$version]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version; nothing to publish."
          else
            should_release=true
          fi

          {
            echo "should_release=$should_release"
            echo "name=$name"
            echo "version=$version"
            echo "tag=$tag"
            echo "bins<<EOF"
            jq -r '.targets[] | select(.kind | index("bin")) | "target/release/\(.name)"' <<<"$package"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Test
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo test --workspace --locked
      - name: Build release binary
        if: steps.metadata.outputs.should_release == 'true'
        run: cargo build --release --locked -p "${{ steps.metadata.outputs.name }}"
      - name: Generate release notes
        if: steps.metadata.outputs.should_release == 'true'
        run: awk '/^## \[/{count++} count==1' CHANGELOG.md > release-notes.md
      - name: Publish release
        if: steps.metadata.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.metadata.outputs.bins }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        if: steps.metadata.outputs.should_release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        if: steps.metadata.outputs.should_release == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opcua-plc-bridge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.metadata.outputs.tag }}
      - name: Build and push Docker image
        if: steps.metadata.outputs.should_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          echo "Checking PR title: '$TITLE'"
          echo "$TITLE" | grep -qE "$pattern" || { echo "::error::PR title must use Conventional Commits"; exit 1; }

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Format
            command: cargo fmt --all -- --check
          - name: Clippy
            command: cargo clippy --all-targets --all-features -- -D warnings
          - name: Test
            command: cargo test --all
          - name: Docs
            command: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake gcc libclang-dev pkg-config python3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  unused-dependencies:
    name: Unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

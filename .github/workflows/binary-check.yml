name: Binary check

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to comment on
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

env:
  SIZE_THRESHOLD: 10

concurrency:
  group: binary-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake gcc libclang-dev pkg-config python3
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Restore baseline
        uses: actions/cache/restore@v5
        with:
          path: baseline.json
          key: binary-baseline-${{ github.run_id }}
          restore-keys: binary-baseline-
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bloat
      - name: Build and compare
        run: |
          set -euo pipefail

          # Create the report before any build command so it is available even
          # when compilation or measurement fails.
          {
            echo "## Binary check"
            echo
            echo "Threshold: binary size +${SIZE_THRESHOLD}%"
            echo
          } > report.md

          cargo build --release
          cargo bloat --release --crates -n 20 > bloat-output.txt

          find target/release -maxdepth 1 -type f -executable \
            -exec stat --format='%n %s' {} \; \
            | sort \
            | jq -R 'split(" ") | {(.[0] | split("/")[-1]): (.[1] | tonumber)}' \
            | jq -s add > sizes.json

          if [ "$(cat sizes.json)" = "null" ]; then
            echo "No release executable was found." >> report.md
            exit 1
          fi

          failed=0
          if [ ! -f baseline.json ]; then
            echo "No baseline available for comparison." >> report.md
            echo "::warning::No binary baseline available for comparison."
          fi

          echo >> report.md
          echo "### Binary sizes" >> report.md
          echo >> report.md
          echo "| Binary | Current | Baseline | Change |" >> report.md
          echo "|---|---:|---:|---:|" >> report.md

          for binary in $(jq -r 'keys[]' sizes.json); do
            current_size=$(jq -r --arg binary "$binary" '.[$binary]' sizes.json)
            current_human=$(numfmt --to=iec "$current_size")
            baseline_size=""
            if [ -f baseline.json ]; then
              baseline_size=$(jq -r --arg binary "$binary" '.binaries[$binary] // empty' baseline.json)
            fi

            if [ -n "$baseline_size" ] && [ "$baseline_size" != "0" ]; then
              baseline_human=$(numfmt --to=iec "$baseline_size")
              size_delta=$(awk -v current="$current_size" -v baseline="$baseline_size" \
                'BEGIN { printf "%.1f", (current - baseline) * 100 / baseline }')
              echo "| \`$binary\` | $current_human | $baseline_human | ${size_delta}% |" >> report.md

              if awk -v delta="$size_delta" -v threshold="$SIZE_THRESHOLD" \
                'BEGIN { exit !(delta > threshold) }'; then
                echo "::error::$binary grew by ${size_delta}% (threshold: ${SIZE_THRESHOLD}%)."
                failed=1
              fi
            else
              echo "| \`$binary\` | $current_human | unavailable | new |" >> report.md
              echo "::warning::New binary '$binary' detected; no baseline is available."
            fi
          done

          echo >> report.md
          echo "### cargo bloat (largest crates)" >> report.md
          echo '```' >> report.md
          cat bloat-output.txt >> report.md
          echo '```' >> report.md

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
      - if: always()
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: report.md
          comment-tag: binary-check
          pr-number: ${{ inputs.pr-number || github.event.pull_request.number }}

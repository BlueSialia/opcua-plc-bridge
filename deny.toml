# cargo-deny configuration for this Rust project.

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDDL-1.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Hippocratic-3.0",
]

# cargo-deny resolves each clarification against the crate being checked, so the
# workspace crates point at the shared license file at the repository root.
[[licenses.clarify]]
name = "core-model"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../LICENSE.md", hash = 0xd9915fd9 }]

[[licenses.clarify]]
name = "driver-common"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../../LICENSE.md", hash = 0xd9915fd9 }]

[[licenses.clarify]]
name = "driver-fins"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../../LICENSE.md", hash = 0xd9915fd9 }]

[[licenses.clarify]]
name = "driver-modbus"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../../LICENSE.md", hash = 0xd9915fd9 }]

[[licenses.clarify]]
name = "opcua-server"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../LICENSE.md", hash = 0xd9915fd9 }]

[[licenses.clarify]]
name = "runtime"
expression = "LicenseRef-Hippocratic-3.0"
license-files = [{ path = "../LICENSE.md", hash = 0xd9915fd9 }]

# unescaper declares "GPL-3.0/MIT" which is a deprecated SPDX expression.
# It is actually dual-licensed (GPL-3.0-only OR MIT); we pick MIT.
[[licenses.clarify]]
name = "unescaper"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "open62541"
expression = "MPL-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
# Dependencies may legitimately contain multiple versions of a crate.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Root workspace for the opcua-plc-bridge project

[workspace]
members = [
    "core-model",
    "driver/common",
    "driver/fins",
    "driver/modbus",
    "opcua-server",
    "runtime",
]

resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
description = "OPC UA bridge for PLCs with a protocol-agnostic tag model and Modbus/FINS drivers"
license-file = "LICENSE.md"
authors = ["Jorge Domínguez Arnáez"]
repository = "https://github.com/BlueSialia/opcua-plc-bridge"

[workspace.dependencies]
core-model = { path = "core-model" }
driver-common = { path = "driver/common" }
driver-fins = { path = "driver/fins" }
driver-modbus = { path = "driver/modbus" }
opcua-server = { path = "opcua-server" }
runtime = { path = "runtime" }
